name: "🔐 Security"
run-name: "${{ github.event_name == 'schedule' && '⏰ ' || '' }}🔐 Security"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: "🔐 Scan ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora, centos]

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: "💿 Build ${{ matrix.distro }} for this runner"
        shell: bash
        run: bash scripts/build/image.sh --distro ${{ matrix.distro }} --load

      - name: "🔐 Scan the image for known vulnerabilities"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "base-${{ matrix.distro }}:local"
          format: sarif
          output: "trivy-${{ matrix.distro }}.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: "⬆️ Upload the findings"
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
        with:
          sarif_file: "trivy-${{ matrix.distro }}.sarif"
          category: "trivy-${{ matrix.distro }}"

  scorecard:
    name: "🛡️ Supply chain"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: "🛡️ Run OSSF scorecard"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: "⬆️ Upload the findings"
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
