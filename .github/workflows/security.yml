name: "🔐 Security"
run-name: "${{ github.event_name == 'schedule' && '⏰ ' || '' }}🔐 Security"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: "🔐 Scan ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora, centos]

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: "💿 Build ${{ matrix.distro }} for this runner"
        shell: bash
        run: bash scripts/build/image.sh --distro ${{ matrix.distro }} --load

      - name: "🔐 Scan the image for known vulnerabilities"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "base-${{ matrix.distro }}:local"
          format: sarif
          output: "trivy-${{ matrix.distro }}.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: "⬆️ Upload the findings"
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: "trivy-${{ matrix.distro }}.sarif"
          category: "trivy-${{ matrix.distro }}"

  scorecard:
    name: "🛡️ Supply chain"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "🛡️ Run OSSF scorecard"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: "⬆️ Upload the findings"
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
