name: "🚀 Publish"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    name: "💿 ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, manjaro, debian, ubuntu, fedora, centos]

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Publish ${{ matrix.distro }}"
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/build/image.sh \
            --distro "${{ matrix.distro }}" \
            --publish \
            --owner "${OWNER}"

      - name: "🏗️ Assert the published tags"
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/test/manifest.sh \
            "${{ matrix.distro }}" \
            "ghcr.io/${OWNER}/base-${{ matrix.distro }}"
