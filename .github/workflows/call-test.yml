name: "🧪 Test"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: "🧪 ${{ matrix.distro }} ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora, centos]
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: "💿 Build ${{ matrix.distro }} for ${{ matrix.platform }}"
        shell: bash
        env:
          LOAD_TAG: "base-${{ matrix.distro }}:probe"
        run: |
          bash scripts/build/image.sh \
            --distro "${{ matrix.distro }}" \
            --load \
            --platform "${{ matrix.platform }}"

      - name: "🧪 Contract"
        shell: bash
        run: |
          bash scripts/test/contract.sh \
            "base-${{ matrix.distro }}:probe" \
            "${{ matrix.platform }}"
