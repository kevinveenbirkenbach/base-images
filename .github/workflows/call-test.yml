name: "🧪 Test"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: "🧪 ${{ matrix.distro }} ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, manjaro, debian, ubuntu, fedora, centos]
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "💿 Build ${{ matrix.distro }} for ${{ matrix.platform }}"
        shell: bash
        env:
          LOAD_TAG: "base-${{ matrix.distro }}:probe"
        run: |
          bash scripts/build/image.sh \
            --distro "${{ matrix.distro }}" \
            --load \
            --platform "${{ matrix.platform }}"

      - name: "🧪 Contract"
        shell: bash
        run: |
          bash scripts/test/contract.sh \
            "base-${{ matrix.distro }}:probe" \
            "${{ matrix.platform }}"
