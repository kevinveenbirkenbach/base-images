name: "🧹 Lint"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shell:
    name: "🐚 Shell"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "🐚 shellcheck"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -e SC1091 \
            scripts/build/*.sh \
            scripts/test/*.sh \
            scripts/installation/*.sh \
            scripts/installation/*/*.sh

  dockerfile:
    name: "🐳 Dockerfile"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "🐳 hadolint"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  actions:
    name: "⚙️ Workflows"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "⚙️ actionlint"
        uses: raven-actions/actionlint@v2

  markdown:
    name: "📝 Markdown"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "📝 markdownlint-cli2"
        uses: DavidAnson/markdownlint-cli2-action@v19
